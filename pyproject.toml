[project]
name = "claims-analytics-warehouse"
version = "1.0.0"
description = "Analytics-engineering case study: lookups, claims, reversals, partner attribution and effective-dated reference costs in DuckDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Runtime and development dependencies are pinned in requirements.txt and
# requirements-dev.txt (installed by `make setup`).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/generated"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# `ruff format` owns line length; long SQL string literals are left readable.
ignore = ["E501"]
