# Local analytics demo: Metabase reading the warehouse built by `make build`.
# Driven by demo/demo.py (make demo / demo-down / demo-reset).
name: claims-analytics-demo

services:
  metabase:
    build: ./metabase
    image: claims-analytics-metabase:v0.63.16.9-duckdb-1.5.5.0
    ports:
      # Loopback only: the demo is never reachable from the network.
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_PLUGINS_DIR: /plugins
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_LOAD_ANALYTICS_CONTENT: "false"
    volumes:
      # Metabase's own application database (users, questions, dashboards).
      - metabase-data:/metabase-data
      # The warehouse DIRECTORY, read-only. A single-file bind mount would pin
      # the old inode and keep serving the previous build after `make build`
      # atomically renames a new file into place.
      - type: bind
        source: ../warehouse
        target: /warehouse
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5m
      start_interval: 3s
    stop_grace_period: 30s
    # Metabase needs no Linux capabilities and never escalates privileges.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No restart policy on purpose: the demo must not come back whenever Docker starts.

volumes:
  metabase-data:
